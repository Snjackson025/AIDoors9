name: Build and Test AIDoors9

on:
  # Runs every day at 06:00 UTC (01:00 EST).
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build project (Debug x64)
      run: msbuild AIDoors9.sln /p:Configuration=Debug /p:Platform=x64

    - name: Run smoke test
      shell: powershell
      run: |
        $exe = "x64\Debug\AIDoors9.exe"
        if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
        $cmds = "create smoke 16`nlist`nquit`n"
        $output = $cmds | & $exe
        Write-Host "--- captured output ---"
        $output | ForEach-Object { Write-Host $_ }
        Write-Host "--- end captured output ---"
        if ($LASTEXITCODE -ne 0) { throw "Smoke test exited with code $LASTEXITCODE" }
        if (-not ($output -match "AIDoors Hardened Core")) { throw "Missing banner in output" }
        if (-not ($output -match "ACTIVE DOORS")) { throw "Missing ACTIVE DOORS in output" }
        if (-not ($output -match "smoke")) { throw "Missing door 'smoke' in output" }
