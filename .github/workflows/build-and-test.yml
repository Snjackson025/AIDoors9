name: Build and Test AIDoors9

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build project (Debug x64)
      run: msbuild AIDoors9.sln /p:Configuration=Debug /p:Platform=x64

    - name: Run smoke test
      shell: powershell
      run: |
        $exe = "x64\Debug\AIDoors9.exe"
        if (-not (Test-Path $exe)) { throw "Executable not found: $exe" }
        $cmds = "create smoke 16`nlist`nquit`n"
        $output = $cmds | & $exe
        if ($LASTEXITCODE -ne 0) { throw "Smoke test exited with code $LASTEXITCODE" }
        if ($output -notmatch "AIDoors Hardened Core") { throw "Missing banner in output" }
        if ($output -notmatch "ACTIVE DOORS") { throw "Missing ACTIVE DOORS in output" }
        if ($output -notmatch "smoke") { throw "Missing door 'smoke' in output" }
